<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة التحليل الأكاديمي الذكي</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 480px; margin: 0 auto; padding: 0; background: #f5f5f5; }
  .header { background: linear-gradient(135deg, #f97316, #f59e0b); padding: 20px; color: white; }
  .header h1 { margin: 0 0 4px; font-size: 22px; }
  .header p { margin: 0; font-size: 13px; opacity: 0.9; }

  .search-row { display: flex; gap: 8px; margin-top: 14px; }
  .search-row input { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 14px; background: rgba(255,255,255,0.92); }
  .search-row button { padding: 10px 16px; border: none; border-radius: 10px; background: white; color: #ea580c; font-weight: bold; cursor: pointer; }
  .search-row button:hover { background: #fff7ed; }

  .tabs { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; }
  .tab-btn { padding: 8px 14px; border-radius: 999px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; background: rgba(255,255,255,0.25); color: white; }
  .tab-btn.active { background: white; color: #ea580c; }

  .content { padding: 16px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .card h3 { margin: 0 0 8px; font-size: 14px; color: #1f2937; }
  .card .sub { font-size: 11px; color: #9ca3af; margin-bottom: 8px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: #fafafa; border-radius: 10px; padding: 10px; text-align: center; }
  .stat-box .val { font-size: 20px; font-weight: bold; color: #1f2937; }
  .stat-box .lbl { font-size: 11px; color: #6b7280; }

  .risk-box { border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 2px solid; }
  .risk-critical { background: #fef2f2; border-color: #fca5a5; }
  .risk-high { background: #fff7ed; border-color: #fdba74; }
  .risk-moderate { background: #fffbeb; border-color: #fcd34d; }
  .risk-low { background: #f0fdf4; border-color: #86efac; }
  .risk-box .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .risk-box .code { font-weight: bold; font-size: 14px; color: #1f2937; }
  .risk-box .badge { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 999px; }
  .badge-critical { color: #dc2626; }
  .badge-high { color: #ea580c; }
  .badge-moderate { color: #d97706; }
  .risk-box .note { font-size: 12px; color: #6b7280; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb; }
  .risk-box .prereq { font-size: 12px; color: #374151; margin-top: 6px; }

  .factor-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .factor-up { color: #dc2626; }
  .factor-down { color: #16a34a; }

  .loading { text-align: center; color: #9ca3af; font-size: 13px; padding: 30px 0; }
  .error-box { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 12px; border-radius: 10px; font-size: 13px; }
  .empty-note { color: #9ca3af; font-size: 12px; text-align: center; padding: 20px 0; }
  .disclaimer { font-size: 11px; color: #9ca3af; padding: 4px; line-height: 1.6; }

  /* Chat */
  .chat-box { height: 360px; overflow-y: auto; background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 12px; max-width: 85%; line-height: 1.7; font-size: 13px; }
  .msg-user { background: #f97316; color: white; margin-right: auto; margin-left: 0; border-bottom-left-radius: 3px; }
  .msg-bot { background: white; border: 1px solid #eee; margin-left: auto; margin-right: 0; border-bottom-right-radius: 3px; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; padding: 10px; border: 1px solid #e5e7eb; border-radius: 999px; font-size: 13px; }
  .chat-input-row button { padding: 10px 18px; border: none; border-radius: 999px; background: #f97316; color: white; font-weight: bold; cursor: pointer; }
  .chat-status { font-size: 11px; color: #9ca3af; margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>🎓 منصة التحليل الأكاديمي</h1>
  <p>بيانات حقيقية بس - Student Analytics</p>
  <div class="search-row">
    <input type="text" id="studentId" placeholder="كود الطالب" value="220072">
    <button onclick="loadStudent()">تحميل</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('overview')">نظرة عامة</button>
    <button class="tab-btn" onclick="showTab('warnings')">الإنذارات</button>
    <button class="tab-btn" onclick="showTab('clustering')">التجميع</button>
    <button class="tab-btn" onclick="showTab('chat')">المستشار</button>
  </div>
</div>

<div class="content">
  <div id="loadStatus"></div>

  <div id="overviewTab" class="tab-content active"></div>
  <div id="warningsTab" class="tab-content"></div>
  <div id="clusteringTab" class="tab-content"></div>
  <div id="chatTab" class="tab-content">
    <div class="card">
      <div class="chat-box" id="chatBox">
        <div class="msg msg-bot">أهلاً! أنا مستشارك الأكاديمي. اسأليني عن أي مادة أو خطة دراسية، أو إزاي تحسّني أدائك.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="اكتبي سؤالك..." onkeypress="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">إرسال</button>
      </div>
      <p class="chat-status" id="chatStatus"></p>
    </div>
  </div>
</div>

<script>
const API_BASE = 'http://localhost:5000';
let currentData = null;
let currentCourseData = null;
let chatHistory = [];

function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(name + 'Tab').classList.add('active');
  event.target.classList.add('active');
}

async function loadStudent() {
  const studentId = document.getElementById('studentId').value.trim();
  const status = document.getElementById('loadStatus');
  status.innerHTML = '<div class="loading">⏳ جاري التحميل...</div>';

  try {
    const lookupRes = await fetch(`${API_BASE}/student/${encodeURIComponent(studentId)}`);
    if (lookupRes.status === 404) throw new Error(`مفيش بيانات محفوظة لكود ${studentId}`);
    if (!lookupRes.ok) throw new Error(`HTTP ${lookupRes.status}`);
    const record = await lookupRes.json();

    const payload = { student_id: studentId };
    ['year1', 'year2', 'year3'].forEach(y => { if (record[y]) payload[y] = record[y]; });

    const [predictRes, coursesRes] = await Promise.all([
      fetch(`${API_BASE}/predict`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      }),
      fetch(`${API_BASE}/student/${encodeURIComponent(studentId)}/courses`)
    ]);

    if (!predictRes.ok) throw new Error(`فشل التنبؤ: HTTP ${predictRes.status}`);
    currentData = await predictRes.json();
    currentCourseData = coursesRes.ok ? await coursesRes.json() : null;

    status.innerHTML = '';
    renderOverview();
    renderWarnings();
    renderClustering();
  } catch (err) {
    status.innerHTML = `<div class="error-box">❌ ${err.message}</div>`;
  }
}

// ============ OVERVIEW ============
function renderOverview() {
  const preds = currentData.predictions;
  const gpaPred = preds.predicted_next_year_gpa;
  let html = '';

  html += `<div class="card">
    <h3>📈 توقع GPA السنة القادمة</h3>`;
  if (gpaPred?.available) {
    html += `<div class="stat-box" style="text-align:right; background:none; padding:0;">
      <div class="val" style="font-size:28px;">${gpaPred.value.toFixed(2)}</div>
      <div class="lbl">سنة ${gpaPred.target_year} - ${gpaPred.confidence_note}</div>
    </div>`;
    html += renderFactors(gpaPred.explanation);
  } else {
    html += `<p class="empty-note">${gpaPred?.reason || 'غير متاح'}</p>`;
  }
  html += `</div>`;

  const cluster = preds.peer_cluster;
  if (cluster?.available) {
    html += `<div class="card">
      <h3>🎯 مستوى الطالب</h3>
      <div class="stat-box" style="text-align:right; background:none; padding:0;">
        <div class="lbl">المجموعة ${cluster.cluster_label}</div>
      </div>
      <p style="font-size:12px; color:#6b7280; margin-top:6px;">${cluster.description}</p>
    </div>`;
  }

  document.getElementById('overviewTab').innerHTML = html;
}

// ============ WARNINGS (per-course + overall) ============
function riskLevel(failRate) {
  if (failRate >= 0.4) return { cls: 'risk-critical', badge: 'badge-critical', label: 'خطر حرج' };
  if (failRate >= 0.15) return { cls: 'risk-high', badge: 'badge-high', label: 'خطر عالي' };
  return { cls: 'risk-moderate', badge: 'badge-moderate', label: 'خطر متوسط' };
}

function renderWarnings() {
  const preds = currentData.predictions;
  let html = '<div class="card"><h3>⚠️ نظام الإنذار المبكر</h3></div>';

  const risks = currentCourseData?.upcoming_course_risks || [];
  if (risks.length > 0) {
    risks.sort((a, b) => b.historical_fail_rate - a.historical_fail_rate).forEach(risk => {
      const level = riskLevel(risk.historical_fail_rate);
      html += `<div class="risk-box ${level.cls}">
        <div class="top">
          <span class="code">${risk.course_code}</span>
          <span class="badge ${level.badge}">${level.label}</span>
        </div>
        <div class="prereq">درجتك في ${risk.prerequisite_course}: <b>${risk.your_prerequisite_grade}</b> (${risk.prerequisite_grade_bucket})</div>
        <div class="note">${risk.note}</div>
      </div>`;
    });
  } else {
    html += `<div class="card"><p class="empty-note">مفيش تنبؤات مقررات قادمة متاحة لهذا الطالب دلوقتي.</p></div>`;
  }

  const warningRisk = preds.warning_risk;
  if (warningRisk?.available) {
    html += `<div class="card">
      <h3>الخطر العام - سنة ${warningRisk.target_year}</h3>
      <div class="stat-box" style="text-align:right; background:none; padding:0;">
        <div class="val">${(warningRisk.probability * 100).toFixed(0)}%</div>
        <div class="lbl">${warningRisk.confidence_note}</div>
      </div>
      ${renderFactors(warningRisk.explanation)}
    </div>`;
  }

  html += `<p class="disclaimer">مخاطر المقررات مغطّاة لـ16 من 53 مقرر فقط (اللي ليها متطلب سابق مؤكد). الحضور غير متاح بعد.</p>`;

  document.getElementById('warningsTab').innerHTML = html;
}

// ============ CLUSTERING ============
function renderClustering() {
  const cluster = currentData.predictions.peer_cluster;
  let html = '<div class="card"><h3>👥 مجموعة الطالب</h3>';

  if (cluster?.available) {
    html += `<div style="background:#fff7ed; border-radius:10px; padding:12px; margin-bottom:10px;">
      <div style="color:#ea580c; font-weight:bold;">المجموعة ${cluster.cluster_label}</div>
      <div style="font-size:12px; color:#6b7280; margin-top:4px;">${cluster.description}</div>
    </div>
    <p style="font-size:11px; color:#9ca3af;">${cluster.confidence_note}</p>`;
  } else {
    html += `<p class="empty-note">${cluster?.reason || 'غير متاح'}</p>`;
  }
  html += '</div>';

  if (cluster?.cluster_stats) {
    html += `<div class="card">
      <h3>📊 إحصائيات المجموعة</h3>
      <p class="sub">محسوبة من الـ495 طالب في بيانات التدريب</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="val">${cluster.cluster_stats.student_count}</div><div class="lbl">طالب في المجموعة</div></div>
        <div class="stat-box"><div class="val" style="color:#ea580c;">${cluster.cluster_stats.avg_cumulative_gpa}</div><div class="lbl">متوسط GPA</div></div>
      </div>
      <p class="disclaimer" style="margin-top:10px;">"نسبة التعافي" مش موجودة - المفهوم ده مش معرّف رياضياً عندنا، فمش هنخترع رقم ليه.</p>
    </div>`;
  }

  document.getElementById('clusteringTab').innerHTML = html;
}

// ============ Shared: factors renderer ============
function renderFactors(factors) {
  if (!factors || factors.length === 0) return '';
  let html = '<div style="margin-top:10px; padding-top:10px; border-top:1px dashed #e5e7eb;"><div style="font-size:11px; font-weight:bold; color:#6b7280; margin-bottom:4px;">أهم العوامل:</div>';
  factors.forEach(f => {
    const up = f.effect.includes('increases') || f.effect.includes('pushes_prediction_up');
    html += `<div class="factor-row">
      <span>${f.factor}</span>
      <span class="${up ? 'factor-up' : 'factor-down'}">${up ? '▲' : '▼'} ${f.student_value}</span>
    </div>`;
  });
  html += '</div>';
  return html;
}

// ============ MARKDOWN RENDERER (for chat) ============
function simpleMarkdownToHtml(text) {
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html = html.replace(/^### (.+)$/gm, '<strong style="display:block;margin:8px 0 3px;font-size:13px;">$1</strong>');
  html = html.replace(/^## (.+)$/gm, '<strong style="display:block;margin:10px 0 4px;font-size:14px;">$1</strong>');
  html = html.replace(/^# (.+)$/gm, '<strong style="display:block;margin:12px 0 4px;font-size:15px;">$1</strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/(?:^|\n)([-*] .+(?:\n[-*] .+)*)/g, block => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^[-*]\s+/, '') + '</li>').join('');
    return '\n<ul style="margin:4px 0;padding-inline-start:18px;">' + items + '</ul>';
  });
  html = html.replace(/(?:^|\n)(\d+\. .+(?:\n\d+\. .+)*)/g, block => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\.\s+/, '') + '</li>').join('');
    return '\n<ol style="margin:4px 0;padding-inline-start:18px;">' + items + '</ol>';
  });
  html = html.replace(/\n(?!<)/g, '<br>');
  return html;
}

function appendMsg(text, isUser) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + (isUser ? 'msg-user' : 'msg-bot');
  if (isUser) { div.textContent = text; } else { div.innerHTML = simpleMarkdownToHtml(text); }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ============ CHAT (UTF-8 safe) ============
async function sendChat() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message) return;
  const studentId = document.getElementById('studentId').value.trim();
  const status = document.getElementById('chatStatus');

  appendMsg(message, true);
  input.value = '';
  status.textContent = '⏳ المستشار بيفكر...';

  const payload = { message, history: chatHistory };
  if (studentId) payload.student_id = studentId;

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    appendMsg(data.reply, false);
    chatHistory.push({ role: 'user', content: message });
    chatHistory.push({ role: 'assistant', content: data.reply });
    status.textContent = data.risk_context_used ? '✅ الرد مبني على بيانات الطالب الحقيقية' : '';
  } catch (err) {
    appendMsg('❌ حصل خطأ: ' + err.message, false);
    status.textContent = '';
  }
}
</script>

</body>
</html>
